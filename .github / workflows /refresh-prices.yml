name: Refresh prices

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect prices
        run: node collect-prices.js

      - name: Commit updated prices
        run: |
          git config user.name  "compgro-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/prices.json
          git diff --staged --quiet || git commit -m "Refresh prices"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
